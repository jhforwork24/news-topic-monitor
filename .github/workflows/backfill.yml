name: Daily backfill

on:
  schedule:
    # 05:20 Asia/Seoul = 20:20 UTC on the previous date. This leaves a bounded
    # recovery window before the last incremental collection (06:17 KST) and
    # the 07:00 KST report window close.
    - cron: "20 20 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Backfill window in hours"
        required: false
        default: "48"
      end:
        description: "Optional exclusive ISO-8601 end"
        required: false

concurrency:
  # See collect.yml: shared with every workflow that writes to data/ via a
  # live Collector.
  group: news-topic-monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONITOR_CONTACT: ${{ vars.MONITOR_CONTACT }}
      REQUEST_INTERVAL_SECONDS: "2.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Recheck recent publications
        env:
          INPUT_HOURS: ${{ inputs.hours || '48' }}
          INPUT_END: ${{ inputs.end }}
        run: |
          args=(backfill --hours "$INPUT_HOURS")
          if test -n "$INPUT_END"; then args+=(--end "$INPUT_END"); fi
          news-topic-monitor "${args[@]}"
      - name: Commit changed outputs
        run: bash scripts/commit_outputs.sh
