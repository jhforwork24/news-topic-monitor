name: Publish daily briefing to Notion

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional KST report end date (YYYY-MM-DD)"
        required: false
      start:
        description: "Optional inclusive ISO-8601 start"
        required: false
      end:
        description: "Optional exclusive ISO-8601 end"
        required: false

concurrency:
  # `publish-notion` only reads JsonlStorage (via build_briefing) and writes
  # to reports/ + Notion — it never runs a live Collector, so it can share
  # the read-only lane with report.yml instead of queuing behind the
  # collect/backfill/editorial-* writers that append to data/.
  group: news-topic-monitor-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # Keep the deterministic publisher as a fallback, but never create a second
    # briefing when the GPT editorial workflow owns publication.
    if: >-
      ${{ vars.NOTION_PUBLISH_ENABLED == 'true' &&
          vars.PUBLICATION_OWNER == 'deterministic_fallback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
      NOTION_CRPD_REFERENCE_URL: ${{ vars.NOTION_CRPD_REFERENCE_URL }}
      NOTION_REPORTS_DATA_SOURCE_ID: ${{ vars.NOTION_REPORTS_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Publish versioned Notion page
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
        run: |
          args=(publish-notion)
          if test -n "$INPUT_DATE"; then args+=(--date "$INPUT_DATE"); fi
          if test -n "$INPUT_START"; then args+=(--start "$INPUT_START"); fi
          if test -n "$INPUT_END"; then args+=(--end "$INPUT_END"); fi
          news-topic-monitor "${args[@]}"
      - name: Commit briefing and publication health
        run: bash scripts/commit_outputs.sh
