name: GPT editorial one-shot dry run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-test-once.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MONITOR_CONTACT: ${{ vars.MONITOR_CONTACT }}
      REQUEST_INTERVAL_SECONDS: "2.0"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      OPENAI_EDITOR_ENABLED: "true"
      OPENAI_EDITOR_MODEL: ${{ vars.OPENAI_EDITOR_MODEL || 'gpt-5.6' }}
      OPENAI_EDITOR_MAX_CANDIDATES: "60"
      OPENAI_EDITOR_FINAL_CANDIDATES: "30"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Run representative editorial dry run
        run: >-
          news-topic-monitor editorial-publish
          --date 2026-08-17
          --collect-hours 48
          --sources hani labortoday beminor ablenews kbs mbc
          --dry-run
      - name: Print sanitized result summary
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          editorial_path = Path("health/editorial/latest.json")
          if editorial_path.exists():
              print("EDITORIAL_RESULT=" + json.dumps(
                  json.loads(editorial_path.read_text(encoding="utf-8")),
                  ensure_ascii=False,
                  sort_keys=True,
              ))
          else:
              print("EDITORIAL_RESULT=missing")

          collection_path = Path("health/latest.json")
          if collection_path.exists():
              payload = json.loads(collection_path.read_text(encoding="utf-8"))
              sources = {
                  name: {
                      key: state.get(key)
                      for key in (
                          "success",
                          "discovery_status",
                          "discovered",
                          "in_window",
                          "bodies_checked",
                          "bodies_blocked",
                          "errors",
                      )
                  }
                  for name, state in payload.get("sources", {}).items()
              }
              print("COLLECTION_RESULT=" + json.dumps(
                  sources,
                  ensure_ascii=False,
                  sort_keys=True,
              ))
          else:
              print("COLLECTION_RESULT=missing")
          PY
