name: Daily report

on:
  schedule:
    # 09:10 Asia/Seoul = 00:10 UTC.
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional KST report end date (YYYY-MM-DD)"
        required: false
      start:
        description: "Optional inclusive ISO-8601 start"
        required: false
      end:
        description: "Optional exclusive ISO-8601 end"
        required: false

concurrency:
  group: news-topic-monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Generate 09:00 KST boundary report
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
        run: |
          args=(report)
          if test -n "$INPUT_DATE"; then args+=(--date "$INPUT_DATE"); fi
          if test -n "$INPUT_START"; then args+=(--start "$INPUT_START"); fi
          if test -n "$INPUT_END"; then args+=(--end "$INPUT_END"); fi
          news-topic-monitor "${args[@]}"
      - name: Commit changed outputs
        run: bash scripts/commit_outputs.sh
