name: Daily report

on:
  schedule:
    # 09:02 Asia/Seoul = 00:02 UTC. Runs well after the 07:00 KST report
    # window closes and the last overlap run (06:17 KST), so this
    # deterministic report never delays the editorial pipeline.
    - cron: "2 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional KST report end date (YYYY-MM-DD)"
        required: false
      start:
        description: "Optional inclusive ISO-8601 start"
        required: false
      end:
        description: "Optional exclusive ISO-8601 end"
        required: false

concurrency:
  # `report` only reads JsonlStorage (via generate_report) and writes to
  # reports/ — it never runs a live Collector, so it doesn't need to
  # serialize behind the collect/backfill/editorial-* writers that append to
  # the same data/ JSONL files. Sharing that group meant this daily report
  # could sit queued for hours behind unrelated collection runs.
  group: news-topic-monitor-reports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Generate 07:00 KST boundary report
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
        run: |
          args=(report)
          if test -n "$INPUT_DATE"; then args+=(--date "$INPUT_DATE"); fi
          if test -n "$INPUT_START"; then args+=(--start "$INPUT_START"); fi
          if test -n "$INPUT_END"; then args+=(--end "$INPUT_END"); fi
          news-topic-monitor "${args[@]}"
      - name: Commit changed outputs
        run: bash scripts/commit_outputs.sh
