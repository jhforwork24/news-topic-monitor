name: Finalize connected Claude briefing

on:
  schedule:
    # 12:00 Asia/Seoul = 03:00 UTC. Late safety-net fallback only: the daily
    # editor+auditor automation normally dispatches this workflow itself
    # (workflow_dispatch) immediately after writing the draft and independent
    # audit, targeting ~10:00-10:30 KST publication. This schedule exists in
    # case that automation never fires; a run here after publication already
    # succeeded is a harmless no-op (publish is idempotent per report date).
    # Day-of-week "1-6" (UTC Mon-Sat, same calendar day as KST here) skips
    # Sunday: no queue is built that day (see editorial-queue.yml), so this
    # fallback has nothing to finalize anyway.
    - cron: "0 3 * * 1-6"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional report date (YYYY-MM-DD)"
        required: false
      start:
        description: "Optional inclusive ISO-8601 start"
        required: false
      end:
        description: "Optional exclusive ISO-8601 end"
        required: false
      dry_run:
        description: "Validate bridge, recrawl, and gate without calling Notion publication"
        required: false
        type: boolean
        default: true
      allow_stale_revalidation:
        description: >-
          Manual exception: bypass the 6-hour report-boundary revalidation deadline.
          Only for a session-approved one-off catch-up publish; never enable by default.
        required: false
        type: boolean
        default: false

concurrency:
  group: news-topic-monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  editorial-finalize:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (vars.PUBLICATION_OWNER == 'claude_editorial_bridge' &&
           vars.NOTION_PUBLISH_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MONITOR_CONTACT: ${{ vars.MONITOR_CONTACT }}
      REQUEST_INTERVAL_SECONDS: "2.0"
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
      NOTION_QUEUE_DATA_SOURCE_ID: ${{ vars.NOTION_QUEUE_DATA_SOURCE_ID }}
      NOTION_CRPD_REFERENCE_URL: ${{ vars.NOTION_CRPD_REFERENCE_URL }}
      NOTION_REPORTS_DATA_SOURCE_ID: ${{ vars.NOTION_REPORTS_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Import Claude draft and audit, recrawl, gate, and publish
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_STALE_REVALIDATION: ${{ inputs.allow_stale_revalidation }}
        run: |
          args=(editorial-finalize)
          if test -n "$INPUT_DATE"; then args+=(--date "$INPUT_DATE"); fi
          if test -n "$INPUT_START"; then args+=(--start "$INPUT_START"); fi
          if test -n "$INPUT_END"; then args+=(--end "$INPUT_END"); fi
          if test "$INPUT_DRY_RUN" = "true"; then args+=(--dry-run); fi
          if test "$INPUT_ALLOW_STALE_REVALIDATION" = "true"; then args+=(--allow-stale-revalidation); fi
          news-topic-monitor "${args[@]}"
      - name: Commit metadata, briefing, and health outputs
        if: ${{ always() }}
        run: bash scripts/commit_outputs.sh
