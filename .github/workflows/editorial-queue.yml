name: Prepare connected Claude editorial queue

on:
  schedule:
    # 05:10 Asia/Seoul = 20:10 UTC (previous date), ten minutes after the
    # 05:00 KST report window closes — the earliest point at which the whole
    # window is available to collect.
    # This is deliberately far earlier than the ~07:30 KST the pipeline
    # actually needs, because GitHub's scheduled trigger is what fires late,
    # not the job: comparing each run's created_at against its nominal cron
    # time shows 1.5-2.5 hours of delay on most days and up to ~8 hours at
    # worst, and moving the minute off the top of the hour (07:05 -> 07:34)
    # changed nothing. The nominal time is the only part we control, so it
    # absorbs a typical delay instead of arguing with it: a 2-hour slip still
    # lands near 07:10 KST, before the connected Claude routine needs the
    # queue. The routine also dispatches this workflow itself when the queue
    # is missing, so a badly delayed schedule no longer stalls the day.
    # Day-of-week "1-5" (UTC Mon-Fri) skips both the UTC Saturday firing
    # (would land at 05:10 KST Sunday) and the UTC Sunday firing (would land
    # at 05:10 KST Monday) — no briefing is published on Sunday or Monday,
    # so no queue is built for either.
    - cron: "10 20 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional report end date (YYYY-MM-DD)"
        required: false
      start:
        description: "Optional inclusive ISO-8601 start"
        required: false
      end:
        description: "Optional exclusive ISO-8601 end"
        required: false
      collect_hours:
        description: "Temporary evidence collection window in hours"
        required: false
        default: "48"
      dry_run:
        description: "Validate candidates without writing the Notion queue"
        required: false
        type: boolean
        default: false

concurrency:
  # See collect.yml: shared with every workflow that writes to data/ via a
  # live Collector.
  group: news-topic-monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  editorial-queue:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          vars.CHAT_EDITORIAL_BRIDGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MONITOR_CONTACT: ${{ vars.MONITOR_CONTACT }}
      REQUEST_INTERVAL_SECONDS: "2.0"
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_QUEUE_DATA_SOURCE_ID: ${{ vars.NOTION_QUEUE_DATA_SOURCE_ID }}
      NOTION_REPORTS_DATA_SOURCE_ID: ${{ vars.NOTION_REPORTS_DATA_SOURCE_ID }}
      CHAT_EDITORIAL_MAX_CANDIDATES: ${{ vars.CHAT_EDITORIAL_MAX_CANDIDATES }}
      CHAT_EDITORIAL_CHUNK_SIZE: ${{ vars.CHAT_EDITORIAL_CHUNK_SIZE }}
      CHAT_EDITORIAL_EVIDENCE_CHARS: ${{ vars.CHAT_EDITORIAL_EVIDENCE_CHARS }}
      CHAT_EDITORIAL_BODY_LIMIT_PER_SOURCE: ${{ vars.CHAT_EDITORIAL_BODY_LIMIT_PER_SOURCE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Collect verified evidence and export the private structured queue
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_COLLECT_HOURS: ${{ inputs.collect_hours || '48' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(editorial-queue --collect-hours "$INPUT_COLLECT_HOURS")
          if test -n "$INPUT_DATE"; then args+=(--date "$INPUT_DATE"); fi
          if test -n "$INPUT_START"; then args+=(--start "$INPUT_START"); fi
          if test -n "$INPUT_END"; then args+=(--end "$INPUT_END"); fi
          if test "$INPUT_DRY_RUN" = "true"; then args+=(--dry-run); fi
          news-topic-monitor "${args[@]}"
      - name: Commit metadata and queue health
        if: ${{ always() }}
        run: bash scripts/commit_outputs.sh
