name: Prepare connected Claude editorial queue

on:
  schedule:
    # 07:34 Asia/Seoul = 22:34 UTC (previous date). The report window closes
    # at 05:00 KST; this fires well clear of the last incremental collection
    # (06:17 KST), so the bounded 48-hour collection can start with the
    # window's articles already discovered, well ahead of the ~10:00-10:30
    # KST publication target.
    # Minute 34 is deliberately off the top of the hour. GitHub documents
    # that scheduled (cron) triggers can be delayed during high-load windows,
    # which cluster near each hour's start; runs observed at minute 5 showed
    # the *scheduled event itself* firing anywhere from ~25 minutes to ~8
    # hours late (compare workflow run created_at against the nominal cron
    # time), which cascaded into late editorial-queue completion and pushed
    # the 09:25 KST editor session's start — and everything after it — later
    # in turn. This does not guarantee on-time firing, only reduces exposure
    # to that specific congestion pattern.
    # Day-of-week "1-5" (UTC Mon-Fri) skips both the UTC Saturday firing
    # (would land at 07:34 KST Sunday) and the UTC Sunday firing (would land
    # at 07:34 KST Monday) — no briefing is published on Sunday or Monday,
    # so no queue is built for either.
    - cron: "34 22 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional report end date (YYYY-MM-DD)"
        required: false
      start:
        description: "Optional inclusive ISO-8601 start"
        required: false
      end:
        description: "Optional exclusive ISO-8601 end"
        required: false
      collect_hours:
        description: "Temporary evidence collection window in hours"
        required: false
        default: "48"
      dry_run:
        description: "Validate candidates without writing the Notion queue"
        required: false
        type: boolean
        default: false

concurrency:
  # See collect.yml: shared with every workflow that writes to data/ via a
  # live Collector.
  group: news-topic-monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  editorial-queue:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          vars.CHAT_EDITORIAL_BRIDGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MONITOR_CONTACT: ${{ vars.MONITOR_CONTACT }}
      REQUEST_INTERVAL_SECONDS: "2.0"
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_QUEUE_DATA_SOURCE_ID: ${{ vars.NOTION_QUEUE_DATA_SOURCE_ID }}
      NOTION_REPORTS_DATA_SOURCE_ID: ${{ vars.NOTION_REPORTS_DATA_SOURCE_ID }}
      CHAT_EDITORIAL_MAX_CANDIDATES: ${{ vars.CHAT_EDITORIAL_MAX_CANDIDATES }}
      CHAT_EDITORIAL_CHUNK_SIZE: ${{ vars.CHAT_EDITORIAL_CHUNK_SIZE }}
      CHAT_EDITORIAL_EVIDENCE_CHARS: ${{ vars.CHAT_EDITORIAL_EVIDENCE_CHARS }}
      CHAT_EDITORIAL_BODY_LIMIT_PER_SOURCE: ${{ vars.CHAT_EDITORIAL_BODY_LIMIT_PER_SOURCE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Collect verified evidence and export the private structured queue
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_COLLECT_HOURS: ${{ inputs.collect_hours || '48' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(editorial-queue --collect-hours "$INPUT_COLLECT_HOURS")
          if test -n "$INPUT_DATE"; then args+=(--date "$INPUT_DATE"); fi
          if test -n "$INPUT_START"; then args+=(--start "$INPUT_START"); fi
          if test -n "$INPUT_END"; then args+=(--end "$INPUT_END"); fi
          if test "$INPUT_DRY_RUN" = "true"; then args+=(--dry-run); fi
          news-topic-monitor "${args[@]}"
      - name: Commit metadata and queue health
        if: ${{ always() }}
        run: bash scripts/commit_outputs.sh
