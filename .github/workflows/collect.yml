name: Collect news metadata

on:
  schedule:
    # Three-hour overlap shifted so the last pre-briefing run starts at 06:17 KST
    # and does not queue behind the 07:00 report/final publication path.
    - cron: "17 21,0,3,6,9,12,15,18 * * *"
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Overlapping collection window in hours"
        required: false
        default: "6"

concurrency:
  # Shared with every other workflow that runs a live Collector against the
  # same data/ JSONL storage (backfill, editorial-queue, editorial-finalize,
  # editorial-publish) — they must stay serialized to avoid concurrent
  # writers on the same files. Read-only workflows (report, publish-notion)
  # use the separate news-topic-monitor-reports group instead.
  group: news-topic-monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONITOR_CONTACT: ${{ vars.MONITOR_CONTACT }}
      REQUEST_INTERVAL_SECONDS: "2.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Collect overlapping window
        env:
          INPUT_SINCE_HOURS: ${{ inputs.since_hours || '6' }}
        run: news-topic-monitor collect --since-hours "$INPUT_SINCE_HOURS"
      - name: Commit changed outputs
        run: bash scripts/commit_outputs.sh
