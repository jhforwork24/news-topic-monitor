name: Collect news metadata

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Overlapping collection window in hours"
        required: false
        default: "6"

concurrency:
  group: news-topic-monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONITOR_CONTACT: ${{ vars.MONITOR_CONTACT }}
      REQUEST_INTERVAL_SECONDS: "2.0"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Collect overlapping window
        env:
          INPUT_SINCE_HOURS: ${{ inputs.since_hours || '6' }}
        run: news-topic-monitor collect --since-hours "$INPUT_SINCE_HOURS"
      - name: Commit changed outputs
        run: bash scripts/commit_outputs.sh
