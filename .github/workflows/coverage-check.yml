name: Capture-rate check

on:
  schedule:
    # 조선일보만 매일(브리핑 대기열 07:35 KST보다 앞선 06:47 KST), 전 매체는 주 1회(일요일 23:07 KST).
    - cron: "47 21 * * *"
    - cron: "7 14 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "chosun(조선일보만) or all(전 매체)"
        required: false
        default: "chosun"
        type: choice
        options:
          - chosun
          - all

concurrency:
  # 수집·대기열·finalize와 같은 data/health 저장소를 쓰므로 같은 그룹으로 직렬화한다.
  group: news-topic-monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONITOR_CONTACT: ${{ vars.MONITOR_CONTACT }}
      REQUEST_INTERVAL_SECONDS: "2.0"
      CHECK_SCOPE: ${{ inputs.scope || (github.event.schedule == '7 14 * * 0' && 'all' || 'chosun') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Compare stored articles with each source's article lists
        id: check
        continue-on-error: true
        run: news-topic-monitor coverage-check --scope "$CHECK_SCOPE"
      - name: Commit coverage health
        if: always()
        run: bash scripts/commit_outputs.sh
      - name: Fail the run when a source is below target or could not be checked
        if: steps.check.outcome == 'failure'
        run: |
          echo "Capture rate below target or a source could not be checked; see health/coverage/latest.json" >&2
          exit 1
